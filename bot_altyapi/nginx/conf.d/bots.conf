# ──────────────────────────────────────────────────────────────
# bots.conf — Webhook endpoint routing
#
# ÇİFT WEBHOOK ÇAKIŞMASI ÇÖZÜMÜ:
# odeme_bot ve Vip_iesrabot artık AYNI URL'i paylaşmıyor. Her biri kendi
# path'ine sahip ve upstream tarafında server.js içinde ayrı route ile
# işleniyor (/webhook/odeme vs /webhook/vip).
#
# TLS: Bu dosya HTTP (80) üzerinden çalışır; production'da certbot ile
# Let's Encrypt sertifikası alındıktan sonra deploy.sh otomatik olarak
# 443/TLS bloğunu ekler (bkz deploy.sh -> setup_tls fonksiyonu).
# ──────────────────────────────────────────────────────────────

upstream odeme_bot_upstream {
    server odeme-bot:3001;
    keepalive 16;
}

upstream arsiv_bot_upstream {
    server arsiv-bot:3002;
    keepalive 16;
}

server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt HTTP-01 doğrulama için
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # nginx healthcheck (docker-compose healthcheck testi bunu kullanır)
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── odeme_bot webhook ──────────────────────────────────────
    location /webhook/odeme {
        limit_req zone=webhook_limit burst=20 nodelay;
        proxy_pass http://odeme_bot_upstream/webhook/odeme;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # ── Vip_iesrabot webhook (odeme_bot'tan AYRI path — çakışma çözümü) ─
    location /webhook/vip {
        limit_req zone=webhook_limit burst=20 nodelay;
        proxy_pass http://odeme_bot_upstream/webhook/vip;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # ── esra_arsiv_bot webhook ─────────────────────────────────
    location /webhook/arsiv {
        limit_req zone=webhook_limit burst=20 nodelay;
        proxy_pass http://arsiv_bot_upstream/webhook/arsiv;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # Tanımsız yollar için 404
    location / {
        return 404;
    }
}
