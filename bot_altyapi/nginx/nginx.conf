# ──────────────────────────────────────────────────────────────
# nginx.conf — Malatya Esra Bot Sistemi ana yapılandırması
# ──────────────────────────────────────────────────────────────
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format webhook_log '$remote_addr - [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            'rt=$request_time';

    access_log /var/log/nginx/access.log webhook_log;

    sendfile        on;
    keepalive_timeout  65;

    # Telegram webhook payload'ları için yeterli boyut
    client_max_body_size 5m;

    # Basit rate limiting — Cloudflare Workers'daki 100k/gün limitine benzer
    # bir sorun yaşamamak için, ama VPS'te limit çok daha yüksek tutulabilir.
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;

    gzip on;
    gzip_types application/json;

    include /etc/nginx/conf.d/*.conf;
}
